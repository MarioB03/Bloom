<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="abg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#D08068"/>
      <stop offset="100%" stop-color="#C4725A"/>
    </radialGradient>
  </defs>

  <!-- Full bleed background for adaptive icon -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#abg)"/>

  <!-- Leaf motif (slightly smaller to stay in safe zone) -->
  
    <g transform="translate(512, 532.48) scale(0.72)">
      <!-- Stem -->
      <path d="M 0 160 Q 0 60, 0 -40"
            stroke="#FAF6F0" stroke-width="18" fill="none"
            stroke-linecap="round"/>

      <!-- Central large leaf (pointing up-right) -->
      <path d="M 0 -40
               Q -20 -180, 40 -280
               Q 80 -320, 120 -280
               Q 160 -220, 100 -140
               Q 60 -80, 0 -40 Z"
            fill="#FAF6F0" opacity="0.95"/>
      <!-- Central leaf vein -->
      <path d="M 10 -60 Q 50 -160, 70 -240"
            stroke="#C4725A" stroke-width="5" fill="none"
            stroke-linecap="round" opacity="0.35"/>

      <!-- Left leaf (pointing up-left) -->
      <path d="M -5 20
               Q -60 -60, -140 -120
               Q -180 -150, -170 -100
               Q -155 -40, -100 0
               Q -50 30, -5 20 Z"
            fill="#FAF6F0" opacity="0.85"/>
      <!-- Left leaf vein -->
      <path d="M -15 10 Q -70 -30, -130 -80"
            stroke="#C4725A" stroke-width="4" fill="none"
            stroke-linecap="round" opacity="0.3"/>

      <!-- Right leaf (pointing right, slightly down) -->
      <path d="M 5 30
               Q 70 -20, 150 -40
               Q 190 -50, 175 -10
               Q 155 40, 100 55
               Q 50 60, 5 30 Z"
            fill="#FAF6F0" opacity="0.85"/>
      <!-- Right leaf vein -->
      <path d="M 15 20 Q 80 0, 140 -20"
            stroke="#C4725A" stroke-width="4" fill="none"
            stroke-linecap="round" opacity="0.3"/>

      <!-- Small accent dot / bud at the tip of the stem -->
      <circle cx="0" cy="170" r="12" fill="#E8A948" opacity="0.7"/>
    </g>
  
</svg>